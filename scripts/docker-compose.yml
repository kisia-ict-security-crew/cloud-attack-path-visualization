services:
  neo4j:
    image: neo4j:5.26-community
    container_name: cloudtrail-graph-3node-v2
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP) — 그래프를 눈으로 보는 곳
      - "7687:7687"   # Bolt — cypher-shell 이 붙는 곳
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
      # LOAD CSV 가 file:/// 로 읽는 디렉터리.
      # 여기에 nodes.csv / edges.csv / context.csv 를 '평평하게' 놓는다.
      # 데이터셋을 바꿀 때는 이 폴더 안의 3개 파일을 갈아끼운다.
      - ./import:/var/lib/neo4j/import
    environment:
      NEO4J_AUTH: neo4j/cloudtrail123

      # ── LOAD CSV: 반드시 꺼야 하는 설정 ──────────────────────────
      # 기본값 true 면 따옴표 안의 백슬래시가 이스케이프 문자로 소비되어
      # \uXXXX 가 조용히 깨진다. 지금 Stratus 데이터엔 백슬래시가 0개지만,
      # IAM 정책 문서가 담긴 로그(PutRolePolicy 등)에는 이스케이프된 JSON 이
      # 통째로 들어와 대량 발생한다.
      NEO4J_dbms_import_csv_legacy__quote__escaping: "false"
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"

      # ── APOC ─────────────────────────────────────────────────────
      # apoc.map.clean       LOAD CSV 가 빈 칸을 null 이 아니라 '' 로 읽는 문제
      # apoc.create.addLabels  labels 컬럼을 실제 멀티라벨로 변환
      # apoc.coll.*          뷰 3 에서 IP 집합 계산
      NEO4J_PLUGINS: '["apoc"]'

      # ── 메모리 ───────────────────────────────────────────────────
      # Stratus 505 이벤트에는 과분하다. flaws.cloud 5만 건을 넣을 거면
      # heap 4G / pagecache 4G 로 올릴 것.
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"

      # 재적재를 반복하면 트랜잭션 로그가 쌓인다. 검증 단계에선 짧게.
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
